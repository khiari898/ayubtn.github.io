
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>Pi Payment Support</title>

  <link rel="icon" href="./logo.jpg" type="image/jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    if (window.Pi && typeof window.Pi.init === "function") {
      window.Pi.init({ version: "2.0", sandbox: false });
    }
  </script>

  <style>
    body {
      margin: 0;
      background: #0b1020;
      color: #fff;
      font-family: 'Cairo', sans-serif;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11,16,32,0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 35px;
      height: 35px;
      background: #4f86ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
    }

    .username {
      color: #facc15;
      font-weight: bold;
    }

    .status {
      font-size: 11px;
      opacity: 0.6;
    }

    .pay-btn {
      background: #3b82f6;
      border: none;
      padding: 10px 20px;
      border-radius: 50px;
      color: #fff;
      cursor: pointer;
    }

    .main-content {
      padding-top: 100px;
      text-align: center;
      padding-bottom: 50px;
    }

    .hero-title {
      font-size: 40px;
      font-weight: 900;
    }

    .hero-subtitle {
      opacity: 0.6;
      margin-top: 10px;
    }

    .support-card {
      margin-top: 40px;
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 20px;
      display: inline-block;
    }

    .features {
      margin-top: 50px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .feature {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 15px;
      width: 200px;
    }
  </style>
</head>

<body>

<header>
  <div class="user-info">
    <div class="user-avatar" id="userAvatar">?</div>
    <div>
      <div id="usernameDisplay" class="username">Guest</div>
      <div id="statusDisplay" class="status">Connecting...</div>
    </div>
  </div>

  <button id="payBtn" class="pay-btn">💰 Pay</button>
</header>

<main class="main-content">

  <h1 class="hero-title">🚀 Support Our Project</h1>
  <p class="hero-subtitle">ادعمنا بـ 1 Pi وخلينا نطورو التطبيق أكثر 💜</p>

  <div class="support-card">
    <h2>💎 1 Pi Only</h2>
    <p>دعمك يساعدنا نكبروا ونضيفو مميزات جديدة</p>

    <button onclick="document.getElementById('payBtn').click()" class="pay-btn">
      Pay Now
    </button>
  </div>

  <div class="features">
    <div class="feature">🚀 تطوير مستمر</div>
    <div class="feature">🔒 محتوى خاص قريبًا</div>
    <div class="feature">💡 أفكار جديدة</div>
  </div>

</main>

<script>
(function() {

  async function postJson(url, body) {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    const txt = await r.text();
    return { ok: r.ok };
  }

  async function initPay() {
    const userEl = document.getElementById('usernameDisplay');
    const statusEl = document.getElementById('statusDisplay');
    const btn = document.getElementById('payBtn');

    if (!window.Pi) {
      statusEl.textContent = "Pi SDK not found";
      return;
    }

    try {
      statusEl.textContent = "Authenticating...";

      const auth = await window.Pi.authenticate(["username","payments"]);

      const username = auth.user.username;

      document.getElementById('userAvatar').textContent = username[0].toUpperCase();
      userEl.textContent = username;

      statusEl.textContent = "Ready ✅";

      btn.onclick = async () => {
        statusEl.textContent = "Creating payment...";

        const paymentData = {
          amount: 1.0,
          memo: "Support Developer",
          metadata: { type: "support" }
        };

        const callbacks = {
          onReadyForServerApproval: (id) => {
            statusEl.textContent = "Approving...";
            postJson("/.netlify/functions/pi-approve", {
              paymentId: id,
              accessToken: auth.accessToken
            }).then(res => {
              statusEl.textContent = res.ok ? "Approved" : "Error";
            });
          },

          onReadyForServerCompletion: (id, txid) => {
            statusEl.textContent = "Completing...";
            postJson("/.netlify/functions/pi-complete", {
              paymentId: id,
              txid,
              accessToken: auth.accessToken
            }).then(res => {
              statusEl.textContent = res.ok ? "Done 💜" : "Error";
            });
          },

          onCancel: () => statusEl.textContent = "Cancelled",
          onError: (err) => statusEl.textContent = err.message
        };

        window.Pi.createPayment(paymentData, callbacks);
      };

    } catch (e) {
      statusEl.textContent = "Auth failed";
    }
  }

  document.addEventListener("DOMContentLoaded", initPay);

})();
</script>

</body>
</html>
